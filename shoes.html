<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes Collection | MAHA Enterprises</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8f9fa; color: #111; }
        .page-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; text-decoration: none; }
        .brand-logo .red { color: #e21b23; } .brand-logo .dark { color: #111; }
        .back-home { text-decoration: none; color: #111; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-home:hover { color: #e21b23; }
        .category-hero-banner { position: relative; width: 100%; height: 320px; background: url('images/collections/shoes.jpg') center/cover no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; margin-bottom: 40px; }
        .category-hero-banner::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(2px); }
        .banner-content { position: relative; z-index: 2; padding: 0 20px; }
        .banner-content h1 { font-size: 3rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .banner-content p { font-size: 1.15rem; font-weight: 400; color: #e0e0e0; }
        .product-grid-container { max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        .product-card { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 10px 20px rgba(0,0,0,0.03); transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1); cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 30px rgba(0,0,0,0.08); }
        .product-image-box { width: 100%; height: 300px; background: #f1f1f1; overflow: hidden; position: relative; }
        .product-image-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-image-box img { transform: scale(1.06); }
        .product-info { padding: 20px; }
        .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .product-price { font-size: 1.2rem; font-weight: 800; color: #e21b23; margin-bottom: 15px; }
        .view-btn { display: inline-block; width: 100%; padding: 10px; text-align: center; background: #111; color: #fff; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .product-card:hover .view-btn { background: #e21b23; }
        @media (max-width: 768px) { .category-hero-banner { height: 220px; } .banner-content h1 { font-size: 2.1rem; } .banner-content p { font-size: 0.95rem; } }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="index.html" class="brand-logo"><span class="red">MAHA</span> <span class="dark">ENTERPRISES</span></a>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </header>
    <section class="category-hero-banner">
        <div class="banner-content">
            <h1>Shoes Collection</h1>
            <p>Premium Sneakers, Formal Leather Shoes & Casual Footwear</p>
        </div>
    </section>
    <!-- Products Grid Container -->
<div class="product-grid-container" id="productsContainer">
        <a href="product-detail.html?id=s1" class="product-card">
            <div class="product-image-box"><img src="images/collections/shoes.jpg" alt="Formal Leather Shoes"></div>
            <div class="product-info">
                <h3 class="product-title">Executive Oxford Leather Shoes</h3>
                <p class="product-price">PKR 6,500</p>
                <span class="view-btn">View Product Details</span>
            </div>
        </a>
    </div>
<!-- Aapki file ke aakhir mein yeh code laga dein -->
<!-- Pehle wale script ko hata kar yeh naya Railway wala script lagayein -->
    <script>
        const API_URL = "https://maha-enterprises-production.up.railway.app/api/products";

        async function loadProductsForCurrentPage() {
            const productsContainer = document.getElementById("productsContainer");
            if (!productsContainer) return;

            try {
                // Railway Database se products fetch karna
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Fetch failed");

                const result = await res.json();
                const products = Array.isArray(result) ? result : (result.data || []);

                // Shoes category ke products filter karna
                const filteredProducts = products.filter(p => p.category === "shoes");

                if (filteredProducts.length === 0) {
                    productsContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #777;">No shoes available yet.</p>`;
                    return;
                }

                // Grid clear karke shoes display karna
                productsContainer.innerHTML = "";
                filteredProducts.forEach(product => {
                    const img = product.mainImg || product.image || "";
                    const id = product._id || product.id;

                    const productHTML = `
                        <a href="product-detail.html?id=${id}" class="product-card">
                            <div class="product-image-box">
                                <img src="${img}" alt="${product.title}">
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">${product.title}</h3>
                                <p class="product-price">PKR ${product.price}</p>
                                <span class="view-btn">View Product Details</span>
                            </div>
                        </a>
                    `;
                    productsContainer.innerHTML += productHTML;
                });
            } catch (err) {
                console.error("Shoes fetch error:", err);
                productsContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: red;">Error loading shoes from server.</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadProductsForCurrentPage);
    </script>
</body>
</html>
