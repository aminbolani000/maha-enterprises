<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MAHA Enterprises</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f4f6f9; color: #111; }
        
        .admin-header {
            background: #111; color: #fff; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-brand { font-size: 1.3rem; font-weight: 800; }
        .admin-brand span { color: #e21b23; }
        .view-site-link {
            color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
            background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 6px; transition: 0.3s;
        }
        .view-site-link:hover { background: #e21b23; }

        .admin-container {
            max-width: 1300px; margin: 30px auto; padding: 0 20px;
            display: grid; grid-template-columns: 380px 1fr; gap: 25px;
        }

        .admin-card {
            background: #fff; border-radius: 12px; padding: 22px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .admin-card h2 {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; color: #111;
            border-bottom: 2px solid #e21b23; padding-bottom: 6px; display: inline-block;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #444; }
        
        .form-control {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 0.9rem; outline: none; transition: 0.3s; background: #fff;
        }
        .form-control:focus { border-color: #e21b23; box-shadow: 0 0 0 3px rgba(226, 27, 35, 0.1); }
        textarea.form-control { resize: vertical; min-height: 70px; }

        .file-upload-box {
            border: 2px dashed #ddd; padding: 12px; border-radius: 8px;
            text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa;
        }
        .file-upload-box:hover { border-color: #e21b23; background: rgba(226, 27, 35, 0.02); }
        .file-upload-box i { font-size: 1.5rem; color: #888; margin-bottom: 4px; }

        .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #ddd; }

        .btn-submit {
            width: 100%; padding: 12px; background: #e21b23; color: #fff;
            border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { background: #c11218; }

        .controls-wrapper {
            display: flex; gap: 15px; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap;
        }
        .search-box {
            position: relative; flex: 1; min-width: 220px;
        }
        .search-box input {
            width: 100%; padding: 10px 12px 10px 38px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; font-size: 0.9rem;
        }
        .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888;
        }

        .category-tabs {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
        }
        .tab-btn {
            padding: 8px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #111; color: #fff; border-color: #111;
        }

        .table-responsive { overflow-x: auto; max-height: 450px; }
        .product-table {
            width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .product-table th, .product-table td {
            padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.88rem;
        }
        .product-table th { background: #111; color: #fff; font-weight: 700; position: sticky; top: 0; z-index: 5; }
        .product-table img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }

        .action-btns { display: flex; gap: 6px; }
        .btn-action {
            border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-delete { background: rgba(226, 27, 35, 0.1); color: #e21b23; }
        .btn-delete:hover { background: #e21b23; color: #fff; }

        @media (max-width: 900px) { .admin-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="admin-brand">MAHA <span>ENTERPRISES</span> Admin Panel</div>
        <a href="index.html" class="view-site-link" target="_blank"><i class="fa-solid fa-globe"></i> View Website</a>
    </header>

    <div class="admin-container">
        
        <!-- Left Side Forms (Product + Banner Upload) -->
        <div class="forms-wrapper">
            
            <!-- 1. Banner Post Upload Form -->
            <div class="admin-card">
                <h2>Add Offer / Banner Post</h2>
                <form id="bannerForm">
                    <div class="form-group">
                        <label>Banner Post Image</label>
                        <div class="file-upload-box" onclick="document.getElementById('bImgFile').click()">
                            <i class="fa-solid fa-rectangle-ad"></i>
                            <p style="font-size:0.8rem; color:#666;">Choose Banner Image</p>
                        </div>
                        <input type="file" id="bImgFile" accept="image/*" style="display:none;" onchange="previewBannerImg(event)">
                        <div class="preview-container" id="bannerImgPreviewBox"></div>
                    </div>

                    <div class="form-group">
                        <label>Target Link / URL (Optional)</label>
                        <input type="url" class="form-control" id="bTargetLink" placeholder="https://example.com/offer or #collections">
                    </div>

                    <button type="submit" class="btn-submit"><i class="fa-solid fa-upload"></i> Upload Banner</button>
                </form>
            </div>

            <!-- 2. Product Upload Form -->
            <div class="admin-card">
                <h2 id="formHeading">Add New Product</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label>Category</label>
                        <select class="form-control" id="pCategory" required>
                            <option value="clothes">Clothes</option>
                            <option value="shoes">Shoes</option>
                            <option value="watches">Watches</option>
                            <option value="perfumes">Perfumes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Product Title</label>
                        <input type="text" class="form-control" id="pTitle" placeholder="e.g. Royal Leather Jacket" required>
                    </div>

                    <div class="form-group">
                        <label>Price (PKR)</label>
                        <input type="number" class="form-control" id="pPrice" placeholder="e.g. 4500" required>
                    </div>

                    <div class="form-group">
                        <label>Main Product Image</label>
                        <div class="file-upload-box" onclick="document.getElementById('pMainFile').click()">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <p style="font-size:0.8rem; color:#666;">Choose main image</p>
                        </div>
                        <input type="file" id="pMainFile" accept="image/*" style="display:none;" onchange="previewMainImg(event)">
                        <div class="preview-container" id="mainImgPreviewBox"></div>
                    </div>

                    <div class="form-group">
                        <label>Additional Angle Images</label>
                        <div class="file-upload-box" onclick="document.getElementById('pAngleFiles').click()">
                            <i class="fa-solid fa-images"></i>
                            <p style="font-size:0.8rem; color:#666;">Choose angle images</p>
                        </div>
                        <input type="file" id="pAngleFiles" accept="image/*" multiple style="display:none;" onchange="previewAngleImgs(event)">
                        <div class="preview-container" id="angleImgsPreviewBox"></div>
                    </div>

                    <div class="form-group">
                        <label>Product Description</label>
                        <textarea class="form-control" id="pDesc" placeholder="Enter product details..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="saveBtn"><i class="fa-solid fa-plus"></i> Save Product</button>
                </form>
            </div>

        </div>

        <!-- Right Side Data Tables (Banner Inventory + Product Inventory) -->
        <div class="tables-wrapper">
            
            <!-- Active Banners List -->
            <div class="admin-card">
                <h2>Active Offer Banners</h2>
                <div class="table-responsive">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th>Banner</th>
                                <th>Link URL</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bannerTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Product Inventory List -->
            <div class="admin-card">
                <h2>Product Inventory</h2>

                <div class="controls-wrapper">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search product name..." onkeyup="fetchProducts()">
                    </div>
                    <div class="category-tabs">
                        <button class="tab-btn active" onclick="setCategoryFilter('all', this)">All</button>
                        <button class="tab-btn" onclick="setCategoryFilter('clothes', this)">Clothes</button>
                        <button class="tab-btn" onclick="setCategoryFilter('shoes', this)">Shoes</button>
                        <button class="tab-btn" onclick="setCategoryFilter('watches', this)">Watches</button>
                        <button class="tab-btn" onclick="setCategoryFilter('perfumes', this)">Perfumes</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

<script>
    const API_URL = "https://maha-enterprises-production.up.railway.app/api/products";
    const BANNER_API_URL = "https://maha-enterprises-production.up.railway.app/api/banners";

    const CLOUD_NAME = "ez2dqiwx"; 
    const UPLOAD_PRESET = "my_preset";

    let mainImageUrl = "";
    let angleImageUrls = [];
    let bannerUploadedUrl = "";
    let currentCategoryFilter = "all";

    /* --------------------------------------------------------------------------
       OPTIMIZATION: Client-Side Image Compression Function
       -------------------------------------------------------------------------- */
    async function compressImage(file) {
        // Skip non-image files
        if (!file.type.startsWith('image/')) return file;

        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 1200; // Resize to max width 1200px
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            resolve(file); // Fallback to original if compression fails
                            return;
                        }
                        resolve(new File([blob], file.name, { type: "image/jpeg", lastModified: Date.now() }));
                    }, "image/jpeg", 0.7); // Compress to 70% quality
                };
                img.onerror = () => resolve(file);
            };
            reader.onerror = () => resolve(file);
        });
    }

    async function uploadToCloudinary(file) {
        // Compress image before sending to Cloudinary
        const compressedFile = await compressImage(file);

        const formData = new FormData();
        formData.append("file", compressedFile);
        formData.append("upload_preset", UPLOAD_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
        });

        if (!res.ok) throw new Error("Cloudinary upload failed");
        const data = await res.json();
        return data.secure_url;
    }

    /* --------------------------------------------------------------------------
       1. BANNER UPLOAD & MANAGEMENT LOGIC
       -------------------------------------------------------------------------- */
    window.previewBannerImg = async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const previewBox = document.getElementById("bannerImgPreviewBox");
        previewBox.innerHTML = `<p style="font-size:0.8rem; color:#888;">Compressing & Uploading...</p>`;

        try {
            bannerUploadedUrl = await uploadToCloudinary(file);
            previewBox.innerHTML = `<img src="${bannerUploadedUrl}" class="preview-img">`;
        } catch (err) {
            alert("Banner upload failed!");
            previewBox.innerHTML = "";
        }
    };

    document.getElementById("bannerForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (!bannerUploadedUrl) {
            alert("Please choose a banner image first!");
            return;
        }

        const bannerData = {
            imageUrl: bannerUploadedUrl,
            linkUrl: document.getElementById("bTargetLink").value || "#collections"
        };

        try {
            const res = await fetch(BANNER_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bannerData)
            });

            if (res.ok) {
                alert("Banner Post Uploaded Successfully!");
                this.reset();
                bannerUploadedUrl = "";
                document.getElementById("bannerImgPreviewBox").innerHTML = "";
                fetchBanners();
            } else {
                alert("Failed to upload banner.");
            }
        } catch (err) {
            console.error("Banner upload error:", err);
            alert("Backend Connection Failed!");
        }
    });

    window.fetchBanners = async function() {
        try {
            const res = await fetch(BANNER_API_URL);
            if (!res.ok) return;

            const result = await res.json();
            const tbody = document.getElementById("bannerTableBody");
            if (!tbody) return;

            tbody.innerHTML = "";
            let banners = Array.isArray(result) ? result : (result.data || []);

            if (banners.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:15px;">No Banners Found</td></tr>`;
                return;
            }

            banners.forEach(b => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${b.imageUrl}" alt="Banner"></td>
                        <td><a href="${b.linkUrl}" target="_blank" style="color:#e21b23; font-weight:600; text-decoration:none;">${b.linkUrl}</a></td>
                        <td>
                            <button class="btn-action btn-delete" onclick="deleteBanner('${b._id}')">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Banner fetch error:", err);
        }
    };

    window.deleteBanner = async function(id) {
        if (confirm("Are you sure you want to delete this banner?")) {
            try {
                const res = await fetch(`${BANNER_API_URL}/${id}`, { method: "DELETE" });
                if (res.ok) fetchBanners();
            } catch (err) {
                console.error("Delete banner error:", err);
            }
        }
    };

    /* --------------------------------------------------------------------------
       2. PRODUCT UPLOAD & MANAGEMENT LOGIC
       -------------------------------------------------------------------------- */
    window.previewMainImg = async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const previewBox = document.getElementById("mainImgPreviewBox");
        previewBox.innerHTML = `<p style="font-size:0.8rem; color:#888;">Compressing & Uploading...</p>`;

        try {
            mainImageUrl = await uploadToCloudinary(file);
            previewBox.innerHTML = `<img src="${mainImageUrl}" class="preview-img">`;
        } catch (err) {
            alert("Main image upload failed!");
            previewBox.innerHTML = "";
        }
    };

    /* OPTIMIZATION: Parallel Multi-File Upload with Promise.all */
    window.previewAngleImgs = async function(event) {
        const files = Array.from(event.target.files);
        if (files.length === 0) return;

        angleImageUrls = [];
        const previewBox = document.getElementById("angleImgsPreviewBox");
        previewBox.innerHTML = `<p style="font-size:0.8rem; color:#888;">Uploading ${files.length} images in parallel...</p>`;

        try {
            // Promise.all runs all image uploads at the exact same time
            angleImageUrls = await Promise.all(files.map(file => uploadToCloudinary(file)));
            
            previewBox.innerHTML = "";
            angleImageUrls.forEach(url => {
                previewBox.innerHTML += `<img src="${url}" class="preview-img">`;
            });
        } catch (err) {
            alert("Angle images upload failed!");
            previewBox.innerHTML = "";
        }
    };

    window.fetchProducts = async function() {
        try {
            const query = document.getElementById("searchInput")?.value.toLowerCase() || "";
            const res = await fetch(`${API_URL}?category=${currentCategoryFilter}`);
            if (!res.ok) return;

            const result = await res.json();
            const tbody = document.getElementById("inventoryTableBody");
            if (!tbody) return;

            tbody.innerHTML = "";

            let products = result.data || result;
            if (!Array.isArray(products) || products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">No Products Found</td></tr>`;
                return;
            }

            if (query) {
                products = products.filter(p => p.title && p.title.toLowerCase().includes(query));
            }

            products.forEach(prod => {
                const displayImg = prod.mainImg || prod.image || "";
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${displayImg}" alt="${prod.title}"></td>
                        <td><strong>${prod.title}</strong></td>
                        <td style="text-transform: capitalize;">${prod.category}</td>
                        <td style="color:#e21b23; font-weight:700;">PKR ${prod.price}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-delete" onclick="deleteProduct('${prod._id}')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Fetch error:", err);
        }
    };

    window.setCategoryFilter = function(cat, btn) {
        currentCategoryFilter = cat;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        fetchProducts();
    };

    window.deleteProduct = async function(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                if (res.ok) fetchProducts();
            } catch (err) {
                console.error("Delete error:", err);
            }
        }
    };

    document.getElementById("productForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (!mainImageUrl) {
            alert("Please select a main image first!");
            return;
        }

        const rawPrice = document.getElementById("pPrice").value;
        const cleanPrice = Number(rawPrice);

        const productData = {
            category: document.getElementById("pCategory").value,
            title: document.getElementById("pTitle").value,
            price: cleanPrice,
            mainImg: mainImageUrl,
            image: mainImageUrl,
            angles: angleImageUrls.length > 0 ? angleImageUrls : [mainImageUrl],
            images: angleImageUrls.length > 0 ? angleImageUrls : [mainImageUrl],
            desc: document.getElementById("pDesc").value,
            description: document.getElementById("pDesc").value
        };

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(productData)
            });

            if (res.ok) {
                alert("Product Saved Successfully!");
                this.reset();
                mainImageUrl = "";
                angleImageUrls = [];
                document.getElementById("mainImgPreviewBox").innerHTML = "";
                document.getElementById("angleImgsPreviewBox").innerHTML = "";
                fetchProducts();
            } else {
                const errData = await res.json().catch(() => ({}));
                alert("Error Saving: " + (errData.message || "Server error (" + res.status + ")"));
            }
        } catch (err) {
            console.error("Save error:", err);
            alert("Backend Connection Failed!");
        }
    });

    // Initial load for both Banners and Products
    document.addEventListener("DOMContentLoaded", () => {
        fetchBanners();
        fetchProducts();
    });
</script>
</body>
</html>
