<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MAHA Enterprises</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f4f6f9; color: #111; }
        
        .admin-header {
            background: #111; color: #fff; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-brand { font-size: 1.3rem; font-weight: 800; }
        .admin-brand span { color: #e21b23; }
        .view-site-link {
            color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
            background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 6px; transition: 0.3s;
        }
        .view-site-link:hover { background: #e21b23; }

        .admin-container {
            max-width: 1300px; margin: 30px auto; padding: 0 20px;
            display: grid; grid-template-columns: 380px 1fr; gap: 25px;
        }

        .admin-card {
            background: #fff; border-radius: 12px; padding: 22px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);
        }
        .admin-card h2 {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; color: #111;
            border-bottom: 2px solid #e21b23; padding-bottom: 6px; display: inline-block;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #444; }
        
        .form-control {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 0.9rem; outline: none; transition: 0.3s; background: #fff;
        }
        .form-control:focus { border-color: #e21b23; box-shadow: 0 0 0 3px rgba(226, 27, 35, 0.1); }
        textarea.form-control { resize: vertical; min-height: 70px; }

        .file-upload-box {
            border: 2px dashed #ddd; padding: 12px; border-radius: 8px;
            text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa;
        }
        .file-upload-box:hover { border-color: #e21b23; background: rgba(226, 27, 35, 0.02); }
        .file-upload-box i { font-size: 1.5rem; color: #888; margin-bottom: 4px; }

        .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #ddd; }

        .btn-submit {
            width: 100%; padding: 12px; background: #e21b23; color: #fff;
            border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { background: #c11218; }
        .btn-cancel {
            width: 100%; padding: 10px; background: #666; color: #fff;
            border: none; border-radius: 8px; font-weight: 600; font-size: 0.88rem;
            cursor: pointer; transition: 0.3s; margin-top: 6px; display: none;
        }

        /* Filter Controls */
        .controls-wrapper {
            display: flex; gap: 15px; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap;
        }
        .search-box {
            position: relative; flex: 1; min-width: 220px;
        }
        .search-box input {
            width: 100%; padding: 10px 12px 10px 38px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; font-size: 0.9rem;
        }
        .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888;
        }

        .category-tabs {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
        }
        .tab-btn {
            padding: 8px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #111; color: #fff; border-color: #111;
        }

        /* Table Styling */
        .table-responsive { overflow-x: auto; max-height: 600px; }
        .product-table {
            width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .product-table th, .product-table td {
            padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.88rem;
        }
        .product-table th { background: #111; color: #fff; font-weight: 700; position: sticky; top: 0; z-index: 5; }
        .product-table img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }

        .action-btns { display: flex; gap: 6px; }
        .btn-action {
            border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-edit { background: rgba(0, 123, 255, 0.1); color: #007bff; }
        .btn-edit:hover { background: #007bff; color: #fff; }
        .btn-delete { background: rgba(226, 27, 35, 0.1); color: #e21b23; }
        .btn-delete:hover { background: #e21b23; color: #fff; }

        @media (max-width: 900px) { .admin-container { grid-template-columns: 1fr; } }
    </style>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

    <header class="admin-header">
        <div class="admin-brand">MAHA <span>ENTERPRISES</span> Admin Panel</div>
        <a href="index.html" class="view-site-link" target="_blank"><i class="fa-solid fa-globe"></i> View Website</a>
    </header>

    <div class="admin-container">
        
        <!-- Form Section (Add & Edit Both) -->
        <div class="admin-card">
            <h2 id="formHeading">Add New Product</h2>
            <form id="productForm">
                <input type="hidden" id="editIndex" value="-1">

                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" id="pCategory" required>
                        <option value="clothes">Clothes</option>
                        <option value="shoes">Shoes</option>
                        <option value="watches">Watches</option>
                        <option value="perfumes">Perfumes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Product Title</label>
                    <input type="text" class="form-control" id="pTitle" placeholder="e.g. Royal Leather Jacket" required>
                </div>

                <div class="form-group">
                    <label>Price (PKR)</label>
                    <input type="text" class="form-control" id="pPrice" placeholder="e.g. PKR 4,500" required>
                </div>

                <!-- Main Image File -->
                <div class="form-group">
                    <label>Main Product Image</label>
                    <div class="file-upload-box" onclick="document.getElementById('pMainFile').click()">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p style="font-size:0.8rem; color:#666;">Choose main image</p>
                    </div>
                    <input type="file" id="pMainFile" accept="image/*" style="display:none;" onchange="previewMainImg(event)">
                    <div class="preview-container" id="mainImgPreviewBox"></div>
                </div>

                <!-- Angle Images File -->
                <div class="form-group">
                    <label>Additional Angle Images</label>
                    <div class="file-upload-box" onclick="document.getElementById('pAngleFiles').click()">
                        <i class="fa-solid fa-images"></i>
                        <p style="font-size:0.8rem; color:#666;">Choose angle images</p>
                    </div>
                    <input type="file" id="pAngleFiles" accept="image/*" multiple style="display:none;" onchange="previewAngleImgs(event)">
                    <div class="preview-container" id="angleImgsPreviewBox"></div>
                </div>

                <div class="form-group">
                    <label>Product Description</label>
                    <textarea class="form-control" id="pDesc" placeholder="Enter product details..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="saveBtn"><i class="fa-solid fa-plus"></i> Save Product</button>
                <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Cancel Edit</button>
            </form>
        </div>

        <!-- Inventory List Section -->
        <div class="admin-card">
            <h2>Product Inventory</h2>

            <!-- Search Bar & Category Filter Tabs -->
            <div class="controls-wrapper">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search product name..." onkeyup="filterProducts()">
                </div>
                <div class="category-tabs">
                    <button class="tab-btn active" onclick="setCategoryFilter('all', this)">All</button>
                    <button class="tab-btn" onclick="setCategoryFilter('clothes', this)">Clothes</button>
                    <button class="tab-btn" onclick="setCategoryFilter('shoes', this)">Shoes</button>
                    <button class="tab-btn" onclick="setCategoryFilter('watches', this)">Watches</button>
                    <button class="tab-btn" onclick="setCategoryFilter('perfumes', this)">Perfumes</button>
                </div>
            </div>

            <!-- Products Data Table -->
            <div class="table-responsive">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Dynamic Records -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
    // Configuration
    const API_URL = "http://localhost:5000/api/products"; // Local testing ke liye

    // Cloudinary Config (Aapko apna Cloud Name aur Unsigned Preset dena hoga)
    const CLOUD_NAME = "YOUR_CLOUDINARY_CLOUD_NAME"; 
    const UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET"; 

    let mainImageUrl = "";
    let angleImageUrls = [];
    let currentCategoryFilter = "all";

    // 1. Cloudinary Upload Widget For Main Image
    const mainWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        multiple: false
    }, (error, result) => {
        if (!error && result && result.event === "success") {
            mainImageUrl = result.info.secure_url;
            document.getElementById("mainImgPreviewBox").innerHTML = 
                `<img src="${mainImageUrl}" class="preview-img">`;
        }
    });

    document.getElementById("uploadMainBtn")?.addEventListener("click", () => mainWidget.open());

    // 2. Cloudinary Upload Widget For Angle Images
    const angleWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME,
        uploadPreset: UPLOAD_PRESET,
        multiple: true
    }, (error, result) => {
        if (!error && result && result.event === "success") {
            angleImageUrls.push(result.info.secure_url);
            const previewBox = document.getElementById("angleImgsPreviewBox");
            previewBox.innerHTML += `<img src="${result.info.secure_url}" class="preview-img">`;
        }
    });

    document.getElementById("uploadAnglesBtn")?.addEventListener("click", () => angleWidget.open());

    // 3. Fetch & Render Products From Database
    async function fetchProducts() {
        try {
            const res = await fetch(`${API_URL}?category=${currentCategoryFilter}`);
            const result = await res.json();
            const tbody = document.getElementById("inventoryTableBody");
            
            if (!tbody) return;
            tbody.innerHTML = "";

            if (!result.data || result.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">No Products Found</td></tr>`;
                return;
            }

            result.data.forEach(prod => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${prod.mainImg}" alt="${prod.title}"></td>
                        <td><strong>${prod.title}</strong></td>
                        <td style="text-transform: capitalize;">${prod.category}</td>
                        <td style="color:#e21b23; font-weight:700;">${prod.price}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-delete" onclick="deleteProduct('${prod._id}')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Error fetching data:", err);
        }
    }

    // 4. Submit Form to Node.js Backend
    document.getElementById("productForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (!mainImageUrl) {
            alert("Please upload a main image first!");
            return;
        }

        const productData = {
            category: document.getElementById("pCategory").value,
            title: document.getElementById("pTitle").value,
            price: document.getElementById("pPrice").value,
            mainImg: mainImageUrl,
            angles: angleImageUrls.length > 0 ? angleImageUrls : [mainImageUrl],
            desc: document.getElementById("pDesc").value
        };

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(productData)
            });

            const responseData = await res.json();
            if (responseData.success) {
                alert("Product saved to MongoDB Database!");
                this.reset();
                mainImageUrl = "";
                angleImageUrls = [];
                document.getElementById("mainImgPreviewBox").innerHTML = "";
                document.getElementById("angleImgsPreviewBox").innerHTML = "";
                fetchProducts();
            }
        } catch (err) {
            console.error("Error saving product:", err);
            alert("Failed to save product!");
        }
    });

    // 5. Delete Product From Database
    async function deleteProduct(id) {
        if (confirm("Are you sure you want to delete this product?")) {
            try {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                fetchProducts();
            } catch (err) {
                console.error("Error deleting product:", err);
            }
        }
    }

    // Initial Load
    document.addEventListener("DOMContentLoaded", fetchProducts);
</script>
</body>
</html>
